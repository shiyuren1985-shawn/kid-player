plugins { id 'com.android.application' }

android {
    namespace 'family.kidcinema'
    compileSdk 35
    defaultConfig {
        applicationId 'family.kidcinema'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('kidPlayerVersionCode') ?: '17').toInteger()
        versionName = (project.findProperty('kidPlayerVersionName') ?: '0.8.1')
        testInstrumentationRunner 'family.kidcinema.SafeTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    bundle { language { enableSplit = false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation('com.hierynomus:smbj:0.14.0') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
